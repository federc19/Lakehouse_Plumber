# This pipeline is used to load the nation table from the raw schema into the bronze schema
# Pipeline variable puts the generate files in the same folder for the pipeline to pick up
pipeline: bronze_load
# Flowgroup are conceptual artifacts and has no functional purpose
# there are used to group actions together in the generated files
flowgroup: nation_bronze

actions:
  - name: nation_raw_load
    type: load
    operational_metadata: ["_processing_timestamp"]
    readMode: stream
    source:
      type: delta
      database: "{catalog}.{raw_schema}"
      table: nation
    target: v_nation_raw
    description: "Load nation table from raw schema" 

  - name: enrich_df
    type: transform
    transform_type: python
    source: v_nation_raw
    module_path: "transformations/nation_transforms.py"
    function_name: "enrich_nation_data"
    parameters:
      enrich_value: "enrikesidoooooo"
    target: v_nation_raw_riki
    readMode: stream
    description: "Load nation data using custom Python extractor"

  - name: nation_raw_db_load
    type: load
    operational_metadata: ["_processing_timestamp"]
    readMode: stream
    source:
      type: delta
      database: "{catalog}.{raw_schema}"
      table: nation
    target: v_nation_raw_db
    description: "Load nation table from raw schema"

  - name: write_nation_bronze
    type: write
    source:
      - v_nation_raw_riki
      - v_nation_raw_db
    write_target:
      type: streaming_table
      database: "{catalog}.{bronze_schema}"
      table: "nation"

  - name: create_tracking_sink
    type: write
    source: v_nation_raw_riki
    write_target:
      type: sink
      format: delta
      options:
        tableName: "{catalog}.{bronze_schema}.sinkTableForTracking"