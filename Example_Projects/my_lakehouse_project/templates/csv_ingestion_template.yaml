  #   target: v_{{ table_name }}_cloudfiles_watermark
  #   readMode: batch
  #   description: "Load nation data using custom Python extractor"

  - name: write_{{ table_name }}_cloudfiles
    type: write
    source: v_{{ table_name }}_cloudfiles_watermark
    write_target:
      type: streaming_table
      database: "{catalog}.{raw_schema}"
      table: "{{ table_name }}"
      cluster_columns: "{{ cluster_columns }}"
      description: "Write {{ table_name }} to raw layer" 
      table_properties: "{{ table_properties }}"