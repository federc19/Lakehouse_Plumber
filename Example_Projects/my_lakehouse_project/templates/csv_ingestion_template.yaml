  #   target: v_{{ table_name }}_cloudfiles
  #   description: "Load {{ table_name }} CSV files from landing volume"

  - name: load_nation_custom_python
    type: load
    readMode: batch
    operational_metadata: ["_record_hash"]
    source:
      type: python
      module_path: "functions.get_table_watermark"
      function_name: "update_table_metadata"
      parameters:
        target_table: "{{ table_name }}"
    target: nation_custom_python_data
    description: "Load nation data using custom Python extractor"

  # - name: resolve_watermark
